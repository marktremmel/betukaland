<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betűkaland szereplőhangok</title>
<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#3a2a20;--mute:#8a7a6a;--line:#e3d6c0;--acc:#2e6a3e;--sel:#ffd23c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#27231f;--ink:#efe6d8;--mute:#a89a88;--line:#3b342c;--acc:#8fd6a0;--sel:#b89020}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 4px}
.mute{color:var(--mute);font-size:13px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;z-index:2;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:3px 10px;cursor:pointer}
button.on{background:var(--sel);color:#000}
.ch{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;margin-top:8px}
.var{border:1px solid var(--line);border-radius:8px;padding:8px}
.var.picked{outline:3px solid var(--acc)}
.var.playing{box-shadow:0 0 0 2px var(--sel)}
.set{font-size:12px;color:var(--mute)}
.ln{font-size:13px;margin-top:6px}
audio{width:100%;height:30px}
textarea{width:100%;font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;margin-top:6px}
</style></head><body><main>
<h1>Szereplőhangok</h1>
<div class="mute">Minden szereplőnek van néhány változata: ugyanaz a hang más hangmagassággal, tempóval, effekttel. Válaszd ki szereplőnként, melyik legyen (Ez legyen), írj megjegyzést, ha valamin állítani kell („kicsit magasabb”, „lassabb”). A végén Export: a fájlt add oda Claude-nak.</div>
<div class="bar"><button data-l="hu" class="on">magyar</button><button data-l="en">English</button><span style="flex:1"></span><button id="exp">Export</button></div>
<div id="list"></div>
</main><script>
const D = __DATA__;
let S = {}; try { S = JSON.parse(localStorage.getItem('bk-cast3') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('bk-cast3', JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'hu', cur = null;
function playSeq(as, box) {
  if (cur) cur.stop = true; const me = cur = { stop: false }; let i = 0;
  document.querySelectorAll('audio').forEach(a => a.pause());
  const next = () => { document.querySelectorAll('.playing').forEach(x => x.classList.remove('playing'));
    if (me.stop || i >= as.length) return; const a = as[i++]; a.closest('.var').classList.add('playing');
    a.currentTime = 0; a.onended = () => setTimeout(next, 300); a.play().catch(next); };
  next();
}
function render() {
  const L = document.getElementById('list'); L.innerHTML = '';
  Object.entries(D.cast[lang] || {}).forEach(([ch, c]) => {
    const key = lang + '-' + ch, box = document.createElement('div'); box.className = 'ch';
    box.innerHTML = `<h2>${esc(c.name)}</h2><button class="all">▶ minden változat egymás után</button><div class="vars"></div><textarea rows="2" placeholder="megjegyzés ehhez a szereplőhöz">${esc(S['note|' + key] || '')}</textarea>`;
    const g = box.querySelector('.vars');
    Object.entries(c.variants).forEach(([vk, sp]) => {
      const id = key + '-' + vk, v = document.createElement('div');
      v.className = 'var' + (S[key] === vk ? ' picked' : '');
      const set = `${sp.voice} · hangmagasság ${sp.pitch > 0 ? '+' : ''}${sp.pitch || 0} · tempó ${sp.speed || 1}${sp.fx ? ' · visszhang' : ''}${sp.gain ? ' · +' + sp.gain + ' dB' : ''}${sp.word ? ' · szó: ' + ({plain: 'ahogy van', period: 'mondatként', slow: 'lassabban', mild: 'kicsit lassabban', stretch: 'normál tempó, utólag nyújtva'}[sp.word] || sp.word) : ''}`;
      v.innerHTML = `<b>${vk}</b> <span class="set">${esc(set)}</span> <button class="pick ${S[key] === vk ? 'on' : ''}">Ez legyen</button> <button class="pl">▶</button>` +
        (D.have[id] || []).map(l => `<div class="ln">${esc(D.lines[l])}</div><audio controls preload="none" src="${encodeURI(id + '/' + l + '.mp3')}"></audio>`).join('') +
        ((D.have[id] || []).length ? '' : '<div class="mute">még nincs felvétel</div>');
      v.querySelector('.pick').onclick = () => { S[key] = vk; save(); render(); };
      v.querySelector('.pl').onclick = () => playSeq([...v.querySelectorAll('audio')]);
      g.appendChild(v);
    });
    box.querySelector('.all').onclick = () => playSeq([...g.querySelectorAll('.var')].map(v => v.querySelector('audio')).filter(Boolean));
    box.querySelector('textarea').onchange = e => { S['note|' + key] = e.target.value; save(); };
    L.appendChild(box);
  });
}
document.querySelectorAll('.bar button[data-l]').forEach(b => b.onclick = () => { lang = b.dataset.l; document.querySelectorAll('.bar button[data-l]').forEach(x => x.classList.toggle('on', x === b)); render(); });
document.getElementById('exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'voice_cast.json'; a.click(); };
render();
</script></body></html>
